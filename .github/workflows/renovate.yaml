# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Renovate
permissions:
  contents: write
  pull-requests: write

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  schedule:
    # minute (0-59) - hour (0-23) - date (1-31) - month (1-12 or JAN-DEC) - day (0-6 or SUN-SAT)
    - cron: '0 09 * * SUN'
  workflow_dispatch: {}

jobs:
  dependencies:
    name: dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Renovate
        uses: renovatebot/github-action@973d3e5a68e735a444e8c03432b66eedb343c302 # v46.2.0
        with:
          configurationFile: .github/renovate.jsonc
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ vars.RENOVATE_DEBUG == 'true' && 'debug' || 'info' }}
