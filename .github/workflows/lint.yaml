# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Lint
permissions:
  contents: read

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock*.yaml

      - name: Install dependencies
        run: pnpm install --merge-git-branch-lockfiles --no-frozen-lockfile

      - name: Build @crm-shared types
        run: pnpm --filter @apps/crm-shared build

      - name: Generate graphql codegen files
        run: pnpm --filter @apps/crm-client --filter @apps/crm-server codegen

      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/javascript@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXTENDS: ./.github/configs/mega-linter.yaml

      - name: Megalinter Artifacts
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
          retention-days: 1
