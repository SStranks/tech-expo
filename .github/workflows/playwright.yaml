# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Playwright
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/crm/client/e2e/**'

  push:
    branches: [main]
    paths:
      - 'apps/crm/client/e2e/**'

  workflow_dispatch: {}

jobs:
  playwright:
    runs-on: ubuntu-latest
    environment: testing

    permissions:
      contents: read
      packages: read
      statuses: write

    container:
      # NOTE: playwright image version must match package.json playwright pkg
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build shared
        run: pnpm --filter @apps/crm-shared build

      - name: Build graphql codegen
        run: pnpm --filter @apps/crm-client codegen

      - name: Run Playwright tests
        run: pnpm --filter @apps/crm-client exec dotenvx run -f ./.env.ci.client.enc -- playwright test
        env:
          DOTENV_PRIVATE_KEY_CI_CLIENT: ${{ secrets.DOTENV_PRIVATE_KEY_CI_CLIENT }}

      - name: Playwright Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/crm/client/playwright-report/
          retention-days: 5
